name: 사이트 오류 점검

# 30분마다 병원체크 페이지를 실제로 열어 보고, 오류가 이어지면 이 저장소에 알림 이슈를 연다(→ 저장소 주인 메일). 풀리면 저절로 닫는다.
# 왜(2026-11-16): 11/15 밤~11/16 08:06 DB 디스크 IO 소진과 업그레이드 재시작 동안 500 오류가 하루 1만 7천 건 났는데,
# 하루 한 번 도는 '운영 점검'은 첫 화면만 봐서 몰랐다. 오류는 저장해 둔 화면이 없는 깊은 페이지(병원 상세, 동네·질병·가격 지역)에서 났다.
# 그래서 사이트맵에서 매번 다른 페이지를 무작위로 골라, 봇처럼 처음 여는 페이지를 연다(주소 끝 _probe 로 저장분을 거치지 않게).
# 머리글 hoscheck-probe 는 Vercel 방화벽 첫 규칙(hoscheck- 로 시작하는 머리글 통과)으로 미국 서버에서도 열린다.
# 언제 도나(2026-11-16): GitHub 예약 실행은 몇 시간씩 늦어서, 병원체크 Vercel 예약 작업(매시 7·37분)이 /api/revalidate(GET)로 바로 실행(workflow_dispatch)을 부른다.
# 아래 schedule 은 Vercel 쪽이 멈췄을 때를 위한 예비. 20분 안에 이미 돌았으면 Vercel 쪽은 건너뛴다.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 페이지 열어 보기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 기본 셸은 명령 하나가 실패하면 바로 멈춘다(bash -e). 연결 오류(curl 35 등)도 '실패한 페이지'로 세야 하므로 끈다
          set +e
          SITE=https://hoscheck.com
          UA="hoscheck-probe/1.0"
          T=$(date +%s)
          pick() { # 사이트맵 하나에서 주소 n개를 무작위로
            curl -s --max-time 30 -A "$UA" "$SITE/sitemaps/$1" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | shuf -n "$2" || true
          }
          H=$((RANDOM % 8))
          URLS=$( { echo "$SITE/"; pick "hospitals-$H.xml" 3; pick prices.xml 2; pick dongs.xml 2; pick open-area.xml 1; pick rankings.xml 1; } | grep -v '^$')
          N=$(echo "$URLS" | wc -l)
          echo "점검할 페이지 $N개"
          check() { # 응답 코드(이동은 따라감). 25초 넘으면 000
            curl -sL -o /dev/null --max-time 25 -A "$UA" -w '%{http_code} %{time_total}' "$1$(case "$1" in *\?*) echo '&';; *) echo '?';; esac)_probe=$T$2" || true
          }
          FAILED=""
          while read -r u; do
            r=$(check "$u" a)
            code=${r%% *}
            if [ "$code" != "200" ]; then
              sleep 20 # 한 번 더(잠깐 끊긴 것까지 알리지 않게)
              r=$(check "$u" b)
              code=${r%% *}
            fi
            echo "$r $u"
            if [ "$code" != "200" ]; then FAILED="$FAILED
          - $code $(printf '%b' "$(echo "$u" | sed 's/%/\\x/g')")"; fi
          done <<< "$URLS"
          BAD=$(echo "$FAILED" | grep -c '^- ' || true)
          echo "실패 $BAD / $N"

          TITLE="[알림] 사이트 페이지 오류"
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          if [ "$BAD" -ge 2 ]; then
            if [ -z "$NUM" ]; then
              BODY="$NOW_KST 점검에서 페이지 ${N}개 중 ${BAD}개가 열리지 않았습니다(20초 뒤 다시 열어도 실패).$FAILED

          흔한 원인: Supabase DB 가 바쁘거나 멈춤(디스크 IO 한도, 재시작), Vercel 장애, 배포 오류.
          확인할 곳: Supabase 설정 > Infrastructure(CPU·디스크 IO), Vercel 로그(상태 500). 풀리면 이 이슈는 저절로 닫힙니다.

          @${{ github.repository_owner }}"
              gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            else
              echo "이미 열린 알림 #$NUM 이 있어 메일을 또 보내지 않음"
            fi
            # 실패로 끝내지 않는다 — 실패로 끝내면 GitHub 가 30분마다 '작업 실패' 메일을 따로 보낸다. 알림은 이슈 하나로만
          elif [ -n "$NUM" ] && [ "$BAD" -eq 0 ]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "$NOW_KST 점검에서 페이지 ${N}개가 모두 열려 닫습니다."
          fi

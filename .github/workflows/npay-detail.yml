name: 비급여 구분별 금액 몰아서 받기

# 병원 상세의 '100,000원 ~ 150,000원'처럼 범위로 보이는 비급여 항목의 구분별 금액(예: 3000타·5000타, 편측·양측)을
# 아직 한 번도 안 받은 병원 전부를 한꺼번에 받는다(처음 한 바퀴용, 수동 실행만).
# 평소에는 매일 정기 실행의 '병원별 비급여' 단계가 병원을 받을 때 구분별 금액도 함께 받는다(한 달에 한 바퀴).
# GitHub 작업 하나는 최대 6시간이라 280분짜리를 세 번 이어 붙였다. 남은 곳이 없으면 뒤 작업은 바로 끝난다.
# 정기 수집과 같은 줄(concurrency: ingest)에 서서, 심평원에 동시에 두 수집이 몰리지 않게 한다.
# 임시 방식: 심평원 공식 API가 나오면(약 3개월 뒤) scripts/lib/npay-detail.ts 만 바꾼다.

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "동시에 받는 병원 수 (1~4). 4 = 초당 약 2~3건, 약 11시간"
        required: false
        default: "4"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  part1:
    name: 1부 (최대 280분)
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      INGEST_SUMMARY_FILE: /tmp/ingest-summary.md
    steps:
      - uses: actions/checkout@v5
        with:
          repository: univblind/hosrank
          ref: main
          ssh-key: ${{ secrets.HOSRANK_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 구분별 금액 받기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          N: ${{ github.event.inputs.concurrency }}
        run: npx tsx scripts/ingest-npay-detail.ts --concurrency "${N:-2}" --minutes 280
      - name: 결과 요약
        if: always()
        run: |
          echo "## 비급여 구분별 금액 — 1부" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$INGEST_SUMMARY_FILE" ]; then cat "$INGEST_SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"; fi

  part2:
    name: 2부 (최대 280분)
    needs: part1
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      INGEST_SUMMARY_FILE: /tmp/ingest-summary.md
    steps:
      - uses: actions/checkout@v5
        with:
          repository: univblind/hosrank
          ref: main
          ssh-key: ${{ secrets.HOSRANK_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 구분별 금액 받기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          N: ${{ github.event.inputs.concurrency }}
        run: npx tsx scripts/ingest-npay-detail.ts --concurrency "${N:-2}" --minutes 280
      - name: 결과 요약
        if: always()
        run: |
          echo "## 비급여 구분별 금액 — 2부" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$INGEST_SUMMARY_FILE" ]; then cat "$INGEST_SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"; fi

  part3:
    name: 3부 (남은 곳 마무리)
    needs: part2
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      INGEST_SUMMARY_FILE: /tmp/ingest-summary.md
    steps:
      - uses: actions/checkout@v5
        with:
          repository: univblind/hosrank
          ref: main
          ssh-key: ${{ secrets.HOSRANK_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 구분별 금액 받기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          N: ${{ github.event.inputs.concurrency }}
        run: npx tsx scripts/ingest-npay-detail.ts --concurrency "${N:-2}" --minutes 280
      - name: 결과 요약
        if: always()
        run: |
          echo "## 비급여 구분별 금액 — 3부" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$INGEST_SUMMARY_FILE" ]; then cat "$INGEST_SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"; fi

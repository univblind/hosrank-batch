name: 운영 점검

# 매일 병원체크가 사람 손 없이 잘 돌아가는지 점검하고, 문제가 있으면 이 저장소에 알림 이슈를 연다(→ 저장소 주인 메일).
# 문제가 풀리면 그 이슈를 저절로 닫는다(2026-10-27 요청 — 고장 나면 바로 알게).
#  1) 사이트 맨 위 'YYYY.MM.DD 갱신' 날짜가 3일 넘게 멈췄는지 (배치가 실패 표시 없이 조용히 멈춘 경우까지 잡는다)
#  2) 정기 수집 배치(공공데이터 수집)가 이틀 넘게 성공하지 못했는지
#  3) 공공데이터포털 API 키 만료가 30일 안으로 다가왔는지 (저장소 변수 DATA_GO_KR_KEY_EXPIRES = YYYY-MM-DD 를 적어 두면)
on:
  schedule:
    # 매일 11:23 KST (02:23 UTC) — 새벽 수집·보조 실행이 끝난 뒤
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 점검
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_EXPIRES: ${{ vars.DATA_GO_KR_KEY_EXPIRES }}
        run: |
          PROBLEMS=""
          NOW=$(date +%s)
          # 1) 사이트 갱신일
          HTML=$(curl -sL --max-time 30 -A "hoscheck-health" https://hoscheck.com/ || true)
          UPD=$(echo "$HTML" | grep -oE '20[0-9]{2}\.[0-9]{2}\.[0-9]{2} 갱신' | head -1 | cut -d' ' -f1 | tr . -)
          if [ -z "$UPD" ]; then
            PROBLEMS="$PROBLEMS
          - 사이트 첫 화면에서 'YYYY.MM.DD 갱신' 날짜를 찾지 못했습니다(사이트가 열리지 않거나 화면이 바뀜)."
          else
            AGE=$(( (NOW - $(date -d "$UPD" +%s)) / 86400 ))
            echo "사이트 갱신일 $UPD ($AGE일 전)"
            if [ "$AGE" -gt 3 ]; then PROBLEMS="$PROBLEMS
          - 사이트 갱신일이 $UPD 로 ${AGE}일째 멈춰 있습니다(정상은 매일 갱신)."; fi
          fi
          # 2) 정기 수집 배치 마지막 성공
          LAST=$(gh run list -R "$GITHUB_REPOSITORY" -w ingest.yml --status success -L 1 --json createdAt -q '.[0].createdAt' || true)
          if [ -z "$LAST" ]; then
            PROBLEMS="$PROBLEMS
          - 공공데이터 수집 배치의 성공 기록을 찾지 못했습니다."
          else
            HOURS=$(( (NOW - $(date -d "$LAST" +%s)) / 3600 ))
            echo "수집 배치 마지막 성공 $LAST (${HOURS}시간 전)"
            if [ "$HOURS" -gt 48 ]; then PROBLEMS="$PROBLEMS
          - 공공데이터 수집 배치가 ${HOURS}시간째 성공하지 못했습니다(마지막 성공 $LAST)."; fi
          fi
          # 3) API 키 만료
          if [ -n "$KEY_EXPIRES" ]; then
            LEFT=$(( ($(date -d "$KEY_EXPIRES" +%s) - NOW) / 86400 ))
            echo "공공데이터포털 키 만료 $KEY_EXPIRES (${LEFT}일 남음)"
            if [ "$LEFT" -le 30 ]; then PROBLEMS="$PROBLEMS
          - 공공데이터포털 API 키가 ${LEFT}일 뒤($KEY_EXPIRES) 만료됩니다. data.go.kr 마이페이지에서 활용 기간을 연장하고 저장소 변수 DATA_GO_KR_KEY_EXPIRES 를 새 날짜로 바꿔 주세요."; fi
          else
            echo "키 만료일 변수(DATA_GO_KR_KEY_EXPIRES)가 없어 만료 점검은 건너뜀"
          fi

          TITLE="[알림] 운영 점검에서 문제 발견"
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$PROBLEMS" ]; then
            BODY="$(TZ=Asia/Seoul date '+%Y-%m-%d') 운영 점검 결과:$PROBLEMS

          @${{ github.repository_owner }}"
            echo "$BODY"
            if [ -n "$NUM" ]; then gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$BODY"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          else
            echo "문제 없음"
            if [ -n "$NUM" ]; then gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "$(TZ=Asia/Seoul date '+%Y-%m-%d') 점검에서 문제가 모두 풀려 닫습니다."; fi
          fi
